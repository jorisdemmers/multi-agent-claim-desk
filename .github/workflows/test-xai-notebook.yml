# GITHUB ACTIONS: run the SHAP and DiCE test notebook once, from top to bottom, with the real model.
#
# - It runs ONLY when someone clicks "Run workflow" in the Actions tab
#   (only people with write access to this repository can do that).
# - Your OpenAI key is read from the repository SECRET called OPENAI_API_KEY.
#   It is never in the code, and GitHub hides it in the logs.
# - The notebook, with all its outputs, is saved as a downloadable file on the run's page.
# - Each notebook has its own budget guard (Step 1).

name: Test the SHAP and DiCE notebooks

on:
  workflow_dispatch:                 # manual start only
    inputs:
      notebook:
        description: "Which notebook?"
        type: choice
        options:
          - claim_desk_xai.ipynb
          - claim_desk_words_demo.ipynb
        default: claim_desk_xai.ipynb

permissions:
  contents: read                     # the workflow may only read this repository

concurrency:
  group: xai-notebook                # one run at a time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20              # stop after 20 minutes, whatever happens
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the packages
        run: pip install "openai>=3.51,<4" shap dice-ml nbconvert ipykernel matplotlib

      - name: Run the notebook from top to bottom
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}    # the secret, handed to the notebook
          NOTEBOOK: ${{ inputs.notebook }}
        run: |
          jupyter nbconvert --to notebook --execute "$NOTEBOOK" \
            --output notebook_run.ipynb --ExecutePreprocessor.timeout=900

      - name: Show the notebook's results in the log
        if: always()
        run: |
          python - <<'PY'
          import json, os
          if os.path.exists("notebook_run.ipynb"):
              nb = json.load(open("notebook_run.ipynb"))
              for cell in nb["cells"]:
                  for out in cell.get("outputs", []):
                      if out.get("name") == "stdout":
                          print("".join(out["text"]))
                      if out.get("output_type") == "error":
                          print("ERROR:", out["ename"], out["evalue"])
                      data = out.get("data", {})
                      if "text/plain" in data and "image/png" not in data:
                          print("".join(data["text/plain"]))
          PY

      - name: Save the notebook with its outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xai-notebook-run
          path: notebook_run.ipynb
          if-no-files-found: ignore
